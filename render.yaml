services:
  - type: web
    name: celoht-indexer
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: CELO_NETWORK
        value: "celoSepolia"
      - key: CONFIRMATIONS
        value: "5"
      - key: BACKFILL_BATCH_SIZE
        value: "2000"
      - key: BACKFILL_MIN_BATCH_SIZE
        value: "100"
      - key: BACKFILL_RPC_CONCURRENCY
        value: "2"
      - key: BACKFILL_CHUNKS_PER_PASS
        value: "1"
      - key: POLL_INTERVAL_MS
        value: "15000"
      - key: RPC_MAX_RETRIES
        value: "5"
      - key: RPC_TIMEOUT_MS
        value: "15000"
      - key: USDM_START_BLOCK
        value: "0"
      - key: DRY_RUN
        value: "false"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CELO_RPC_URL
        sync: false
      - key: CELO_SEPOLIA_ARCHIVE_RPC_URL
        sync: false
