name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  production-readiness:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: celoht_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d celoht_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:integration
        env:
          POSTGRES_TEST_URL: postgresql://postgres:postgres@127.0.0.1:5432/celoht_test
          CELO_RPC_URL: https://forno.celo-sepolia.celo-testnet.org

  codeql:
    uses: github/codeql-action/.github/workflows/codeql.yml@v3
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
